<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forever & Always ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{
background:linear-gradient(135deg,#140014,#2b002b,#000);
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
color:white;
text-align:center;
}

.container{
z-index:5;
padding:20px;
}

h1{
font-family:"Great Vibes",cursive;
font-size:72px;
color:#ff6db5;
margin-bottom:20px;
text-shadow:0 0 20px hotpink;
}

p{
font-size:22px;
line-height:1.8;
margin-bottom:20px;
}

#timer{
font-size:28px;
font-weight:bold;
color:#ffd700;
margin:25px 0;
}

button{
padding:18px 45px;
border:none;
border-radius:50px;
font-size:22px;
cursor:pointer;
background:#ff2f92;
color:white;
box-shadow:0 0 25px hotpink;
transition:.4s;
}

button:hover{
transform:scale(1.1);
}

.heart{
position:absolute;
font-size:20px;
animation:float 8s linear infinite;
color:#ff4da6;
opacity:.7;
}

@keyframes float{
0%{
transform:translateY(100vh);
opacity:0;
}
20%{opacity:1;}
100%{
transform:translateY(-120px);
opacity:0;
}
}

.firework{
position:absolute;
width:6px;
height:6px;
border-radius:50%;
background:white;
animation:explode 1.2s linear forwards;
}

@keyframes explode{
0%{
transform:scale(.5);
opacity:1;
}
100%{
transform:translate(var(--x),var(--y)) scale(3);
opacity:0;
}
}

#message{
display:none;
margin-top:35px;
font-size:34px;
font-family:"Great Vibes",cursive;
color:#ffd4e8;
}
</style>
</head>

<body>

<div class="container">

<h1>Forever & Always ❤️</h1>

<p>
No matter where life takes us,<br>
my heart will always choose you.<br><br>

Thank you for making my world brighter,<br>
my smile bigger,<br>
and my life more beautiful.<br><br>

I love you endlessly, Nida.
</p>

<div id="timer"></div>

<button onclick="celebrate()">Yes, Forever ❤️</button>

<div id="message">
❤️ Forever Yours, Nida ❤️
</div>

</div>

<script>

// Floating Hearts
for(let i=0;i<80;i++){

let h=document.createElement("div");

h.className="heart";

h.innerHTML="❤";

h.style.left=Math.random()*100+"vw";

h.style.fontSize=(12+Math.random()*30)+"px";

h.style.animationDuration=(5+Math.random()*8)+"s";

h.style.animationDelay=Math.random()*5+"s";

document.body.appendChild(h);

}

// Timer (change this date)
const start=new Date("2026-01-01");

function update(){

const now=new Date();

const diff=now-start;

const days=Math.floor(diff/86400000);

document.getElementById("timer").innerHTML=
"❤️ Together for "+days+" beautiful days ❤️";

}

update();

setInterval(update,1000);

// Fireworks
function firework(){

for(let i=0;i<25;i++){

let f=document.createElement("div");

f.className="firework";

f.style.left=Math.random()*100+"vw";

f.style.top=Math.random()*100+"vh";

f.style.setProperty("--x",(Math.random()*250-125)+"px");

f.style.setProperty("--y",(Math.random()*250-125)+"px");

document.body.appendChild(f);

setTimeout(()=>f.remove(),1200);

}

}

function celebrate(){

document.getElementById("message").style.display="block";

firework();

setInterval(firework,1800);

}

</script>

</body>
</html>
