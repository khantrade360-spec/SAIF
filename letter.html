<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Letter To Nida ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;500&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Poppins,sans-serif;
background:linear-gradient(135deg,#120012,#2b002b,#000);
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
color:white;
}

.stars{
position:fixed;
width:100%;
height:100%;
overflow:hidden;
z-index:0;
}

.star{
position:absolute;
width:2px;
height:2px;
background:white;
border-radius:50%;
animation:twinkle 2s infinite alternate;
}

@keyframes twinkle{
from{opacity:.2;}
to{opacity:1;}
}

.card{

width:90%;
max-width:700px;

background:rgba(255,255,255,.08);

backdrop-filter:blur(15px);

padding:35px;

border-radius:25px;

box-shadow:0 0 35px rgba(255,0,120,.5);

z-index:2;

}

h1{

font-family:"Great Vibes",cursive;

font-size:58px;

color:#ff6fb5;

text-align:center;

margin-bottom:25px;

}

#text{

font-size:20px;

line-height:1.9;

white-space:pre-wrap;

}

</style>

</head>

<body>

<div class="stars" id="stars"></div>

<div class="card">

<h1>My Letter To Nida ❤️</h1>

<p id="text"></p>

</div>

<script>

const message=`Happy Girlfriend's Day, my beautiful Nida ❤️

The day you came into my life, everything changed in the most beautiful way. You filled my world with happiness, love, peace, and countless reasons to smile. Every memory we have created together is precious to me, and every moment with you feels like a dream I never want to wake up from.

You are my peace, my happiness, my safe place, and the most beautiful chapter of my life. If I had to choose again, I would still choose you every single time.

Thank you for loving me, believing in me, and making my life brighter than I ever imagined.

I promise to love you, respect you, support you, and stand beside you through every season of life.

Forever Yours,
❤️`;

let i=0;

function type(){

if(i<message.length){

document.getElementById("text").innerHTML+=message.charAt(i);

i++;

setTimeout(type,35);

}

}

type();

for(let s=0;s<120;s++){

let star=document.createElement("div");

star.className="star";

star.style.left=Math.random()*100+"vw";

star.style.top=Math.random()*100+"vh";

star.style.animationDelay=Math.random()*2+"s";

document.getElementById("stars").appendChild(star);

}

</script>

</body>
</html>
